name: Release CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # contents:write is required to publish the release. All other permissions are restricted.
      contents: write
      actions: none
      checks: none
      deployments: none
      issues: none
      packages: none
      pull-requests: none
      statuses: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build CLI binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF#refs/tags/}
          
          build_and_archive() {
            local os=$1
            local arch=$2
            local ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            
            echo "Building for $os/$arch..."
            GOOS=$os GOARCH=$arch go build -ldflags="-s -w -X main.version=$VERSION" -o "dist/aptify-cli-${os}-${arch}${ext}" ./cmd/aptify-cli
          }
          
          build_and_archive linux amd64
          build_and_archive linux arm64
          build_and_archive darwin amd64
          build_and_archive darwin arm64
          build_and_archive windows amd64

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum aptify-cli-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/aptify-cli-*
            dist/checksums.txt
          generate_release_notes: true

